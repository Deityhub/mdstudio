name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, licenses, Workers build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # better-sqlite3 ships its binaries; its install script would only try to compile them again
      # (Bun runs it by default), which fails where there is no compiler.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run tailwind:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run licenses
      # Default preset: the Cloudflare Workers bundle that production deploys.
      - run: bun run build
      # Keeps the Worker well under Cloudflare's 3 MiB free-plan limit and browser-only libraries out.
      - run: bun run bundle:check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's image already has Chromium and the system libraries it needs, so the job does not
    # download them from apt on every run. Its version must match @playwright/test
    # (infra/ci-workflow.test.ts checks), or the library finds no browser.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # Pinned here, so the Node version does not change with the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # From npm rather than setup-bun: the image has no `unzip`, which setup-bun needs.
      - run: npm install -g bun@1.3.14
      # better-sqlite3 ships its binaries; its install script would only try to compile them again
      # (Bun runs it by default), which fails where there is no compiler.
      - run: bun install --frozen-lockfile --ignore-scripts
      # Builds the self-hosted (node-server) output and tests it in a real browser.
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t mdstudio:ci .
      - name: Run the container and probe it
        run: |
          docker run -d --name mdstudio -p 3000:3000 mdstudio:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/editor
      - if: failure()
        run: docker logs mdstudio
