name: Prepare release

# Manual: Actions > Prepare release > Run workflow (on the dev branch).
# Bumps the version, writes the changelog and opens a release PR into main. Merging that PR runs
# the Release workflow (tag, GitHub Release, Docker images, Cloudflare deploy).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (semantic versioning)
        type: choice
        options: [patch, minor, major]
        default: minor
        required: true

concurrency: prepare-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Only run from dev
        if: github.ref_name != 'dev'
        run: |
          echo "::error::Run this workflow from the dev branch."
          exit 1

      # A personal access token (not GITHUB_TOKEN) so CI runs on the release PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bump version and write changelog
        id: bump
        run: echo "version=$(bun scripts/release.ts "${{ inputs.bump }}")" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --body "Release v${VERSION} (${{ inputs.bump }}). Merging publishes the GitHub Release, the Docker images and the Cloudflare deploy. After the release, merge main back into dev."
