name: Preview

# Every pull request into dev gets its own Worker on workers.dev (mdstudio-pr-<number>), and the
# PR shows the URL in a comment and in its Deployments box. The Worker is deleted when the PR
# closes. Pull requests from forks are skipped: they cannot read the Cloudflare secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKER: mdstudio-pr-${{ github.event.pull_request.number }}
  MARKER: "<!-- mdstudio-preview -->"

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # PREVIEW_WORKER_NAME makes the build name the Worker, leave out the production domain and
      # send a noindex header (see infra/worker-config.ts).
      # Previews share one real-time hub, like the database, deployed first because each preview
      # binds to it by name. (Its topics are account ids, so previews on one database see one another.)
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config infra/realtime/wrangler.jsonc --name mdstudio-realtime-preview
      - run: bun run build
        env:
          PREVIEW_WORKER_NAME: ${{ env.WORKER }}
          D1_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_PREVIEW_BUCKET }}
          REALTIME_SCRIPT: mdstudio-realtime-preview
      # All previews share one throwaway database; the schema is applied before the Worker ships.
      - name: Apply database migrations
        if: vars.D1_PREVIEW_DATABASE_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --config .output/server/wrangler.json
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Mail goes out from previews too, so invitations, confirmation and review notices can be tried
      # on a pull request. Only the mail secrets are sent (not the GitHub, Google or CAPTCHA ones),
      # and only those that are set; the Worker keeps them until it is deleted with the pull request.
      # Links in the mail point at the preview, whose address the Worker takes from the request.
      - name: Upload the mail secrets to the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          json=$(bun -e 'const n="RESEND_API_KEY MAILTRAP_API_TOKEN MAIL_FROM".split(" ");console.log(JSON.stringify(Object.fromEntries(n.filter(k=>process.env[k]).map(k=>[k,process.env[k]]))))')
          [ "$json" = "{}" ] || echo "$json" | bunx wrangler secret bulk --config .output/server/wrangler.json
      - id: url
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$OUTPUT" | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the preview URL in Wrangler's output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.url.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$MARKER
          **Preview ready:** $URL

          Built from \`${SHA:0:7}\`. It updates on every push and is removed when this pull request closes. It is not indexed by search engines."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
      - name: Say so when the preview failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$MARKER
          **Preview failed.** See the [workflow run]($RUN)."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

  cleanup:
    name: Remove preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Fails harmlessly when the pull request never got a preview.
      - name: Delete the preview Worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name ${{ env.WORKER }} --force
      - name: Update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -f body="$MARKER
          The preview for this pull request was removed." >/dev/null
          fi
